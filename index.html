<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons : la tête du renard aux petites tailles (le logo entier
         devient illisible à 16 px), le logo complet pour les grandes icônes.
         Pas d'arrondi appliqué : iOS et Android ajoutent le leur. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0b10" />

    <!-- Polices en <link> plutôt qu'en @import CSS : évite la cascade
         CSS → découverte → téléchargement, qui retarde le premier rendu. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <meta name="author" content="Netfox" />
    <link rel="canonical" href="https://netfox.ai/" />
    <meta name="google-site-verification" content="rzt-v-bureB5XmEdFPnDaodi6LVH2hdfNRmyXpNZjFk" />

    <meta property="og:url" content="https://netfox.ai/" />
    <meta property="og:site_name" content="Netfox" />
    <meta property="og:locale" content="fr_FR" />
    <!-- Partage : le titre SEO parle à Google, celui-ci parle à un humain qui
         reçoit le lien. D'où deux formulations différentes, c'est voulu. -->
    <meta property="og:title" content="NETFOX · Maison digitale" />
    <meta property="og:description" content="L'art de l'acquisition de clients en ligne." />
